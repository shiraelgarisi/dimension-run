<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Temple Dash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div id="score">0</div>
      <div id="dist">0 m</div>
    </div>
    <div class="hud-right">
      <div class="coins"><span class="coin-icon"></span><span id="coins">0</span></div>
      <div class="hud-buttons">
        <button id="muteBtn" title="Sound (M)">♪</button>
        <button id="pauseBtn" title="Pause (P)">❚❚</button>
      </div>
    </div>
    <div id="power" class="hidden">
      <span>🧲 MAGNET</span>
      <div class="bar"><div id="powerFill"></div></div>
    </div>
  </div>

  <div id="hint" class="hidden"></div>
  <div id="flash"></div>

  <div id="start" class="overlay">
    <div class="panel">
      <h1>TEMPLE<span>DASH</span></h1>
      <p class="tag">You stole the golden idol. The temple wants it back.</p>
      <div class="controls">
        <div><kbd>←</kbd><kbd>→</kbd> turn / change lane</div>
        <div><kbd>↑</kbd> / <kbd>Space</kbd> jump</div>
        <div><kbd>↓</kbd> slide</div>
        <div class="touch">📱 Swipe in any direction</div>
      </div>
      <button id="playBtn" class="big">RUN!</button>
      <p class="best">Best: <b id="bestStart">0</b></p>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="panel">
      <h2 id="deathMsg">The demons caught you!</h2>
      <div id="newBest" class="hidden">★ NEW BEST ★</div>
      <div class="stats">
        <div><small>SCORE</small><b id="finalScore">0</b></div>
        <div><small>DISTANCE</small><b id="finalDist">0 m</b></div>
        <div><small>COINS</small><b id="finalCoins">0</b></div>
      </div>
      <p class="best">Best: <b id="bestOver">0</b></p>
      <button id="againBtn" class="big">RUN AGAIN</button>
      <p class="small">or press Enter</p>
    </div>
  </div>

  <div id="paused" class="overlay hidden">
    <div class="panel">
      <h2>PAUSED</h2>
      <button id="resumeBtn" class="big">RESUME</button>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
